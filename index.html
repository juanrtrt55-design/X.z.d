<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Music Player - App Pro Offline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            outline: none !important;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            color: #ffffff;
        }

        video::-webkit-media-controls,
        video::-webkit-media-controls-enclosure,
        video::-webkit-media-controls-panel,
        video::-webkit-media-controls-play-button,
        video::-webkit-media-controls-start-playback-button,
        audio::-webkit-media-controls {
            display: none !important;
            -webkit-appearance: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .app-layout {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            background: #000000;
            position: relative;
            overflow: hidden;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            z-index: 10;
            gap: 8px;
            background: #000000;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .icon-btn:active { background: rgba(255,255,255,0.12); }

        .search-input-top {
            flex: 1;
            background: #111111;
            border: 1px solid #333333;
            color: #ffffff;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 16px;
            user-select: text;
        }
        .search-input-top::placeholder { color: #777777; }

        .top-controls-group {
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
            margin-left: auto;
        }

        .effects-toggle-btn {
            background: #151515;
            border: 1px solid #333333;
            color: #d8b4fe;
            font-size: 10px;
            font-weight: bold;
            padding: 6px 11px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .effects-toggle-btn.active {
            background: #9333ea;
            color: #ffffff;
            border-color: #c084fc;
        }

        .effects-dropdown-menu {
            position: absolute;
            top: 40px;
            right: 0;
            background: #111111;
            border: 1px solid #333333;
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 50;
            box-shadow: 0 10px 25px rgba(0,0,0,0.95);
            width: 185px;
        }

        .fx-menu-item {
            background: #1c1c1c;
            border: 1px solid #333333;
            color: #d8b4fe;
            font-size: 11px;
            font-weight: bold;
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .fx-menu-item.active {
            background: #9333ea;
            color: #ffffff;
            border-color: #c084fc;
        }
        .fx-badge {
            font-size: 9px;
            font-family: monospace;
            padding: 2px 5px;
            border-radius: 4px;
            background: rgba(0,0,0,0.35);
        }

        .hero-artwork-container {
            position: relative;
            width: 100%;
            height: 34vh;
            min-height: 200px;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            cursor: pointer;
            background: #000000;
        }

        .offline-cover-art {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #main-cover-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000000;
            z-index: 1;
        }

        #main-media-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000000;
            z-index: 2;
        }

        #main-media-video.video-fullscreen-active {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: contain !important;
            z-index: 9990 !important;
            background: #000000 !important;
            transform: none !important;
        }

        .force-landscape-mode {
            position: fixed !important;
            top: 0 !important;
            left: 100vw !important;
            width: 100vh !important;
            height: 100vw !important;
            transform: rotate(90deg) !important;
            transform-origin: 0 0 !important;
            z-index: 9990 !important;
            object-fit: contain !important;
            background: #000000 !important;
            border-radius: 0 !important;
        }

        .artwork-gradient-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            background: linear-gradient(to top, #000000 0%, transparent 100%);
            z-index: 3;
            pointer-events: none;
        }

        .song-meta-info {
            position: relative;
            z-index: 4;
            padding: 0 20px 6px 20px;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            pointer-events: none;
        }

        .favorite-btn {
            background: transparent;
            border: none;
            color: #ec4899;
            cursor: pointer;
            padding: 4px;
            pointer-events: auto;
        }

        .fs-ui-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            padding: 16px 20px 20px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.5) 70%, transparent 100%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.3s ease-in-out;
        }

        .fs-ui-overlay.fs-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .fs-controls-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
            min-height: 48px;
        }

        .fs-center-btns {
            display: flex;
            gap: 20px;
            align-items: center;
            margin: 0 auto;
        }

        .fs-close-btn {
            background: rgba(30, 30, 30, 0.85);
            color: #ffffff;
            border: 1px solid #555555;
            border-radius: 10px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            right: 4px;
        }
        .fs-close-btn:active { transform: scale(0.92); }

        .landscape-fs-btn {
            background: rgba(245, 158, 11, 0.2);
            color: #fde68a;
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 10px;
            padding: 0 12px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: bold;
            position: absolute;
            left: 4px;
        }
        .landscape-fs-btn:active { transform: scale(0.92); }

        .middle-actions-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 22px;
            padding: 10px 20px;
            background: #000000;
        }

        .action-icon-btn {
            background: transparent;
            border: none;
            color: #777777;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .action-icon-btn.active { color: #a855f7; }
        .action-icon-btn:active { transform: scale(0.9); }

        .import-plus-btn {
            background: #1c1c1c;
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #333333;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }
        .import-plus-btn:active { transform: scale(0.92); }

        .main-controls-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            padding: 6px 0;
            background: #000000;
        }

        .ctrl-sub-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            opacity: 0.92;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-sub-btn:active { transform: scale(0.9); }

        .play-pause-circle-btn {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border: 3px solid #78350f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000000;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
        }
        .play-pause-circle-btn:active { transform: scale(0.93); }

        .progress-section {
            padding: 6px 20px 10px 20px;
            background: #000000;
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #888888;
            margin-bottom: 4px;
            font-family: monospace;
        }

        .custom-range {
            width: 100%;
            height: 5px;
            background: #222222;
            border-radius: 3px;
            appearance: none;
            cursor: pointer;
            accent-color: #f59e0b;
        }

        .playlist-drawer {
            flex: 1;
            background: #000000;
            border-top: 1px solid #151515;
            border-radius: 18px 18px 0 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 10px 16px;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: bold;
            color: #d8b4fe;
            border-bottom: 1px solid #151515;
            padding-bottom: 6px;
        }

        .category-tabs-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 2px;
        }
        .category-tabs-bar::-webkit-scrollbar { display: none; }

        .cat-tab-btn {
            background: #0e0e0e;
            border: 1px solid #242424;
            color: #a1a1aa;
            font-size: 10px;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 10px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .cat-tab-btn.active {
            background: #170b24;
            color: #e9d5ff;
            border-color: #a855f7;
        }

        .playlist-scroll-area {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .playlist-scroll-area::-webkit-scrollbar { display: none; }

        .playlist-item-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0a0a0a;
            border: 1px solid #1c1c1c;
            padding: 7px 10px;
            border-radius: 10px;
            cursor: pointer;
        }
        .playlist-item-card.active {
            background: #170b24;
            border-color: #a855f7;
        }

        .item-thumb {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            object-fit: cover;
            background: #141414;
            margin-right: 10px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a855f7;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-layout">
        <div class="top-nav">
            <button class="icon-btn" id="btn-search" title="Buscar archivo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
            <input type="text" id="search-input" class="search-input-top hidden" placeholder="Buscar archivo multimedia...">

            <div class="top-controls-group">
                <button class="effects-toggle-btn" id="btn-open-effects">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
                    EQ
                </button>

                <div id="effects-dropdown" class="effects-dropdown-menu hidden">
                    <button class="fx-menu-item" id="fx-bass">
                        <span>🔊 Bass</span> <span class="fx-badge">OFF</span>
                    </button>
                    <button class="fx-menu-item" id="fx-twister">
                        <span>✨ Twister</span> <span class="fx-badge">OFF</span>
                    </button>
                    <button class="fx-menu-item" id="fx-dolby">
                        <span>💎 ©®</span> <span class="fx-badge">OFF</span>
                    </button>
                    <button class="fx-menu-item" id="fx-6d">
                        <span>🌀 6D</span> <span class="fx-badge">OFF</span>
                    </button>
                    <button class="fx-menu-item active" id="fx-stereo">
                        <span>🎧 Estéreo</span> <span class="fx-badge">ON</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="hero-artwork-container" id="hero-cover-box" title="Toca para pantalla completa">
            <div class="offline-cover-art" id="default-offline-cover">
                <svg width="105" height="105" viewBox="0 0 120 120" fill="none">
                    <circle cx="60" cy="60" r="54" stroke="#1f1f1f" stroke-width="2" stroke-dasharray="6 4"/>
                    <circle cx="60" cy="60" r="42" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="2"/>
                    <circle cx="60" cy="60" r="14" fill="#000000" stroke="#f59e0b" stroke-width="2"/>
                    <circle cx="60" cy="60" r="4" fill="#f59e0b"/>
                </svg>
            </div>
            <img id="main-cover-img" class="hidden" alt="Cover">
            <video id="main-media-video" class="hidden" crossorigin="anonymous" playsinline preload="auto" disablePictureInPicture controlsList="nodownload nofullscreen noremoteplayback"></video>
            <div class="artwork-gradient-overlay"></div>
            <div class="song-meta-info">
                <button class="favorite-btn" id="btn-fav">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                </button>
            </div>
        </div>

        <div class="middle-actions-row">
            <button id="btn-shuffle" class="action-icon-btn" title="Aleatorio">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
            </button>
            <button id="btn-repeat" class="action-icon-btn" title="Repetir">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            </button>

            <input type="file" id="files-input" accept="audio/*,video/*,.mp3,.wav,.ogg,.m4a,.flac,.aac,.wma,.opus,.mp4,.mkv,.webm,.avi,.mov,.3gp" multiple class="hidden">
            <button class="import-plus-btn" onclick="document.getElementById('files-input').click();" title="Importar archivos multimedia">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>

            <button id="btn-playlist-toggle" class="action-icon-btn active" title="Lista de reproducción">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15V6"/><path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/></svg>
            </button>
        </div>

        <div class="main-controls-container">
            <button class="ctrl-sub-btn" id="prevBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
            </button>
            <button class="play-pause-circle-btn" id="playBtn">
                <svg id="play-icon-svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="margin-left:2px;"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </button>
            <button class="ctrl-sub-btn" id="nextBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
            </button>
        </div>

        <div class="progress-section">
            <div class="time-labels">
                <span id="time-current">00:00</span>
                <span id="time-total">00:00</span>
            </div>
            <input type="range" id="progress-bar" value="0" min="0" max="100" class="custom-range">
        </div>

        <div class="playlist-drawer" id="playlist-drawer">
            <div class="drawer-header">
                <span>Lista Multimedia</span>
                <span id="playlist-counter" style="font-size:11px; color:#c084fc; font-family:monospace;">0 archivos</span>
            </div>
            <div class="category-tabs-bar" id="category-tabs">
                <button class="cat-tab-btn active" data-category="all">Todos</button>
                <button class="cat-tab-btn" data-category="radio">Radios</button>
                <button class="cat-tab-btn" data-category="audio">Audio (MP3+)</button>
                <button class="cat-tab-btn" data-category="video">Videos</button>
            </div>
            <div class="playlist-scroll-area" id="media-list-container"></div>
        </div>
    </div>

    <audio id="mainAudio" crossorigin="anonymous" preload="auto" playsinline class="hidden"></audio>

    <div id="fs-ui-overlay" class="fs-ui-overlay hidden">
        <div class="time-labels">
            <span id="fs-time-current">00:00</span>
            <span id="fs-time-total">00:00</span>
        </div>
        <input type="range" id="fs-progress-bar" value="0" min="0" max="100" class="custom-range">
        <div class="fs-controls-bar">
            <button class="landscape-fs-btn" id="landscape-fs-btn" title="Forzar horizontal">
                <span>🔄 Horizontal</span>
            </button>

            <div class="fs-center-btns">
                <button class="ctrl-sub-btn" id="fs-prev">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
                </button>
                <button class="play-pause-circle-btn" id="fs-play" style="width:48px; height:48px;">
                    <svg id="fs-play-svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="margin-left:2px;"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                </button>
                <button class="ctrl-sub-btn" id="fs-next">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
                </button>
            </div>

            <button class="fs-close-btn" id="fs-close" title="Salir de pantalla completa">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

    <script>
        const RADIOS_JSON_URL = 'https://raw.githubusercontent.com/pitufoardiente000/Radio/refs/heads/main/radios.json';

        const audio = document.getElementById('mainAudio');
        const mainMediaVideo = document.getElementById('main-media-video');
        const defaultOfflineCover = document.getElementById('default-offline-cover');
        const mainCoverImg = document.getElementById('main-cover-img');
        const heroCoverBox = document.getElementById('hero-cover-box');

        const fsUiOverlay = document.getElementById('fs-ui-overlay');
        const fsClose = document.getElementById('fs-close');
        const landscapeFsBtn = document.getElementById('landscape-fs-btn');
        const fsPlay = document.getElementById('fs-play');
        const fsPrev = document.getElementById('fs-prev');

        function initAudioContext() {

                audioCtx = new AudioCtxClass({ latencyHint: 'playback' });
                analyser = audioCtx.createAnalyser();

                audioSourceNode = audioCtx.createMediaElementSource(audio);
                videoSourceNode = audioCtx.createMediaElementSource(mainMediaVideo);
                audioSourceNode.connect(masterAudioInputNode);
                videoSourceNode.connect(masterAudioInputNode);

                const masterInput = audioCtx.createGain(); masterInput.gain.value = 0.35;
                const bassSplitter = audioCtx.createGain(); bassSplitter.gain.value = 1.0;

                const subsonicFilter = audioCtx.createBiquadFilter(); subsonicFilter.type = 'highpass'; subsonicFilter.frequency.value = 8; subsonicFilter.Q.value = 1.0;
                const bassLowpass = audioCtx.createBiquadFilter(); bassLowpass.type = 'lowpass'; bassLowpass.frequency.value = 25; bassLowpass.Q.value = 1.0;

                subEngine = audioCtx.createBiquadFilter(); subEngine.type = 'lowshelf'; subEngine.frequency.value = 90; subEngine.gain.value = 0;

                bassCompressor.threshold.value = -16.0; bassCompressor.knee.value = 14.0; bassCompressor.ratio.value = 12.0; bassCompressor.attack.value = 0.002; bassCompressor.release.value = 0.25;

                const clarity = audioCtx.createBiquadFilter(); clarity.type = 'peaking'; clarity.frequency.value = 3000; clarity.gain.value = 8;
                tweeterNode = audioCtx.createBiquadFilter(); tweeterNode.type = 'highshelf'; tweeterNode.frequency.value = 10000; tweeterNode.gain.value = 0;

                dolbyNode = audioCtx.createBiquadFilter(); dolbyNode.type = 'peaking'; dolbyNode.frequency.value = 3500; dolbyNode.Q.value = 0.8; dolbyNode.gain.value = 0;

                monoNode.channelInterpretation = 'speakers';

                masterInput.connect(bassSplitter);
                bassSplitter.connect(subsonicFilter); subsonicFilter.connect(bassLowpass); bassLowpass.connect(subEngine); subEngine.connect(deepEngine); deepEngine.connect(bassCompressor); bassCompressor.connect(bassOutput); bassOutput.connect(masterSum);

        function inferMimeType(coverSrc) {
            if (!coverSrc) return 'image/jpeg';
            if (coverSrc.startsWith('data:image/png')) return 'image/png';
            if (coverSrc.startsWith('data:image/webp')) return 'image/webp';
            return 'image/jpeg';

        function updateMediaSession(song) {
            if (!song) return;

            const artworkList = song.cover
                ? [
                    { src: song.cover, sizes: '96x96', type: inferMimeType(song.cover) },
                    { src: song.cover, sizes: '256x256', type: inferMimeType(song.cover) },
                    { src: song.cover, sizes: '512x512', type: inferMimeType(song.cover) }
                  ]
                : [];

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title || 'Reproduciendo',
                    artist: song.artist || 'Artista Desconocido',
                    album: song.album || 'Music Player',
                    artwork: artworkList
                });

                navigator.mediaSession.setActionHandler('play', () => window.__onNativeMediaAction('play'));
                navigator.mediaSession.setActionHandler('pause', () => window.__onNativeMediaAction('pause'));

                navigator.mediaSession.setActionHandler('seekbackward', (details) => {
                    const activePlayer = getActiveMediaElement();
                    const skipTime = details.seekOffset || 10;
                    activePlayer.currentTime = Math.max(0, (activePlayer.currentTime || 0) - skipTime);
                    syncMediaSessionState();
                });

                navigator.mediaSession.setActionHandler('seekforward', (details) => {
                    const activePlayer = getActiveMediaElement();
                    const skipTime = details.seekOffset || 10;
                    const maxTime = (activePlayer.duration && isFinite(activePlayer.duration))
                        ? activePlayer.duration
                        : (activePlayer.currentTime || 0) + skipTime;
                    activePlayer.currentTime = Math.min(maxTime, (activePlayer.currentTime || 0) + skipTime);

                    const activePlayer = getActiveMediaElement();
                    if (details.fastSeek && 'fastSeek' in activePlayer) {

                    } else if (typeof details.seekTime === 'number') {
                        activePlayer.currentTime = details.seekTime;

                });

                navigator.mediaSession.setActionHandler('previoustrack', () => prevBtn.click());
                navigator.mediaSession.setActionHandler('nexttrack', () => nextBtn.click());
            }

            notifyNativeBridge({
                event: 'metadata',
                title: song.title || 'Reproduciendo',
                artist: song.artist || 'Artista Desconocido',
                album: song.album || 'Music Player',
                cover: song.cover || null,
                isPlaying: isPlaying

            syncMediaSessionState();
        }

            updateMainArtwork(current);

        function getRandomIndex() {

            let nextIdx;
            do {
                nextIdx = Math.floor(Math.random() * playlist.length);
            } while (nextIdx === currentIndex);
            return nextIdx;
        }

        nextBtn.addEventListener('click', () => {
            if (playlist.length === 0) return;
            currentIndex = isShuffleActive ? getRandomIndex() : (currentIndex + 1) % playlist.length;
            playSelectedSong();
        });

        prevBtn.addEventListener('click', () => {
            if (playlist.length === 0) return;
            currentIndex = isShuffleActive ? getRandomIndex() : (currentIndex - 1 + playlist.length) % playlist.length;
            playSelectedSong();
        });

        filesInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            const wasEmpty = playlist.length === 0;
            Array.from(files).forEach((file) => {
                const isVideo = file.type.startsWith('video/') || /\.(mp4|mkv|webm|avi|mov|3gp)$/i.test(file.name);
                const mediaObj = {
                    title: file.name.replace(/\.[^/.]+$/, ""),
                    artist: isVideo ? "Video Local" : "Artista Desconocido",
                    album: isVideo ? "Videos Locales" : "Álbum Desconocido",
                    cover: null,
                    url: URL.createObjectURL(file),
                    type: isVideo ? "video" : "audio",
                    category: isVideo ? "video" : "audio"
                };

                if (!isVideo && window.jsmediatags) {
                    try {
                        window.jsmediatags.read(file, {
                            onSuccess: function(tag) {
                                if (tag.tags.title) mediaObj.title = tag.tags.title;
                                if (tag.tags.artist) mediaObj.artist = tag.tags.artist;
                                if (tag.tags.album) mediaObj.album = tag.tags.album;
                                if (tag.tags.picture) {
                                    const data = tag.tags.picture.data;
                                    const format = tag.tags.picture.format;
                                    let base64String = "";
                                    for (let i = 0; i < data.length; i++) {
                                        base64String += String.fromCharCode(data[i]);
                                    }
                                    mediaObj.cover = `data:${format};base64,${window.btoa(base64String)}`;
                                    const idx = playlist.indexOf(mediaObj);
                                    if (idx === currentIndex) {
                                        updateMainArtwork(mediaObj);
                                        updateMediaSession(mediaObj);
                                    }
                                }
                                renderPlaylist();
                            }
                        });
                    } catch (err) {}
                }

                playlist.push(mediaObj);
            });

            renderPlaylist();
            if (wasEmpty) {
                currentIndex = 0;
                playSelectedSong();
            }
            filesInput.value = '';
        });

        function syncTimeUI(player) {
            if (player.duration && !isNaN(player.duration) && isFinite(player.duration)) {
                const percent = (player.currentTime / player.duration) * 100;
                progressBar.value = percent;
                fsProgressBar.value = percent;
                const cur = formatTime(player.currentTime);
                const tot = formatTime(player.duration);
                timeCurrent.textContent = cur;
                timeTotal.textContent = tot;
                fsTimeCurrent.textContent = cur;
                fsTimeTotal.textContent = tot;
            } else if (player.duration === Infinity) {
                timeCurrent.textContent = formatTime(player.currentTime);
                timeTotal.textContent = "EN VIVO";
                fsTimeCurrent.textContent = formatTime(player.currentTime);
                fsTimeTotal.textContent = "EN VIVO";
            }
        }

        audio.addEventListener('timeupdate', () => syncTimeUI(audio));
        mainMediaVideo.addEventListener('timeupdate', () => syncTimeUI(mainMediaVideo));

        audio.addEventListener('loadedmetadata', syncMediaSessionState);
        mainMediaVideo.addEventListener('loadedmetadata', syncMediaSessionState);

        progressBar.addEventListener('input', () => {
            const activePlayer = getActiveMediaElement();
            if (activePlayer.duration && isFinite(activePlayer.duration)) {
                activePlayer.currentTime = (progressBar.value / 100) * activePlayer.duration;
                syncMediaSessionState();
            }
        });

        function handleMediaEnded(player) {
            if (isRepeatActive) {
                player.currentTime = 0;
                player.play();
                syncMediaSessionState();
            } else {
                nextBtn.click();
            }
        }

        audio.addEventListener('ended', () => handleMediaEnded(audio));
        mainMediaVideo.addEventListener('ended', () => handleMediaEnded(mainMediaVideo));

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        loadRadiosFromJSON();
        renderPlaylist();
    </script>
</body>
</html>
